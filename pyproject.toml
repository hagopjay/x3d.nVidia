[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x3dnv"
version = "0.1.1"
description = "x3d.nVidia: X3D meets NVIDIA — NIM probes, OpenUSD/Omniverse bridges, Gaussian splats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
usd = ["usd-core>=26.3"]
dev = ["pytest>=8", "usd-core>=26.3", "pillow", "lxml"]
newton = ["newton[importers]==1.8.0", "mujoco==4.0.1", "mujoco-warp==4.0.1", "lxml"]

[project.scripts]
x3dnv-splats = "x3dnv.splats:main"
x3dnv-probe = "x3dnv.probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
